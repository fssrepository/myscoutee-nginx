log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';
    # One operator switch for automatic consent; manual opening remains available.
    map $host $myscoutee_consent_auto { default 0; }
    # Temporary landing diagnostics: change only default to 1, then nginx -t / reload.
    map $host $myscoutee_landing_debug { default 0; }
    # Only fixed numeric hints from the original HTML request enter SSI/diagnostics.
    map "$http_sec_purpose|$http_purpose|$http_x_purpose" $myscoutee_landing_purpose {
        default 0;
        ~*prerender 2;
        ~*(prefetch|preview) 1;
    }
    map $http_sec_fetch_user $myscoutee_landing_user { default 0; "?1" 1; }
    log_format landing_debug '$remote_addr - - [$time_local] "$request" '
                             '$status $body_bytes_sent "-" "$http_user_agent"';
