load_module /usr/lib/nginx/modules/ngx_http_partition_module.so;
load_module /usr/lib/nginx/modules/ngx_http_edge_module.so;
thread_pool myscoutee_background threads=1 max_queue=1;
env AUTH_REGION_SECURITY_ENABLED;
env MYSCOUTEE_RUNTIME_STATUS_TOKEN;
env MYSCOUTEE_RUNTIME_STATUS_TOKEN_FILE;
env MYSCOUTEE_RUNTIME_STATUS_TOKENS_JSON;
env POD_NAMESPACE;
env MYSCOUTEE_RUNTIME_SERVICES;
