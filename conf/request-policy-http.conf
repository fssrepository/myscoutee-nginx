# Allow long literal API paths in nginx's native hash map.
map_hash_bucket_size 128;
myscoutee_edge_state 32m;
myscoutee_blocklist_file /etc/nginx/myscoutee-operator/nginx-blocked-ips.json;
myscoutee_scanner_threshold 100;
myscoutee_scanner_window 600;
# Deployment route inventory, compiled by nginx once on load.
map $uri $myscoutee_route_known {
    default 0;
    # Chrome probes this optional discovery URL whenever DevTools opens locally.
    /.well-known/appspecific/com.chrome.devtools.json 1;
    "~(?:^|/)\\.(?!well-known(?:/|$))" 0;
    "~*\\.(?:php[0-9]?|asp|aspx|cgi|env|sql|bak)(?:/|$)" 0;
    include /etc/nginx/public-routes.map;
}
map $myscoutee_route_known $myscoutee_unknown_route { 0 1; default 0; }
map $uri $myscoutee_request_limit_key {
    /nginx-health "";
    /api/runtime-status "";
    /api/runtime-status/events "";
    default $binary_remote_addr;
}
limit_req_zone $myscoutee_request_limit_key zone=myscoutee_requests:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=myscoutee_unknown:10m rate=2r/s;
