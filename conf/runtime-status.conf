# Small browser diagnostics stay at nginx. The query is recorded by the existing
# dedicated log; the POST body is empty and nothing is forwarded to Java or Mongo.
location = /__landing-debug {
    if ($myscoutee_landing_debug != 1) { return 404; }
    if ($request_method != POST) { return 405; }
    if ($args !~ "^d=[A-Za-z0-9%_.~!*'()-]{1,3500}$") { return 400; }
    client_max_body_size 1k;
    access_log /var/log/nginx/landing-debug.log landing_debug;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
    return 204;
}

# Public availability only; no management details or credentials leave nginx.
location = /api/runtime-status {
    limit_except GET { deny all; }
    myscoutee_runtime_status;
    default_type application/json;
    access_log off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
}

location = /api/runtime-status/events {
    limit_except GET { deny all; }
    myscoutee_runtime_events;
    gzip off;
    access_log off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
}

# Coordinate eligibility is evaluated against the bundled partition geometry.
location = /api/auth/eligibility {
    limit_except GET { deny all; }
    myscoutee_partition_check;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
}

location = /assets/diagnostics/landing.js {
    alias /usr/share/nginx/diagnostics/landing.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
}
