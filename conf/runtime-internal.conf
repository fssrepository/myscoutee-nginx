# Internal network only: pushes require each service's credential.
server {
    listen 9081;
    server_name _;
    client_max_body_size 1k;
    client_body_buffer_size 2k;
    client_body_timeout 2s;
    access_log off;
    location = /internal/runtime-status { myscoutee_runtime_receive; }
    location = /internal/traffic-summary {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        myscoutee_traffic_summary;
    }
    location / { return 404; }
}
