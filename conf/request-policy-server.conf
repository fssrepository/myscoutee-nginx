limit_req zone=myscoutee_requests burst=120 nodelay;
limit_req_status 429;
error_page 419 = @myscoutee_unknown_route;
error_page 429 = @myscoutee_rate_limited;
if ($myscoutee_route_known = 0) { return 419; }
access_log /var/log/nginx/access.log main;
access_log /tmp/myscoutee-scanner.log scanner if=$myscoutee_unknown_route;

location @myscoutee_unknown_route {
    limit_req zone=myscoutee_unknown burst=10 nodelay;
    # Content-phase rejection: rate limiting runs before this 404.
    root /usr/share/nginx/html;
    try_files /__myscoutee_unknown_route_does_not_exist =404;
}
location @myscoutee_rate_limited {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "1" always;
    return 429 "Too many requests. Slow down.\n";
}
