name: Release nginx image

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf 'RELEASE_VERSION=%s\nNGINX_NATIVE_TEST_IMAGE=%s\n' "$version" "$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
      - name: Verify native modules
        run: |
          python3 tests/edge-test.py
          python3 tests/kubernetes-test.py
          python3 tests/native-test.py
          python3 -B -m unittest discover -s tools/traffic -p 'test_*.py'
      - name: Publish and verify image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          built_id="$(docker image inspect --format '{{.Id}}' "$NGINX_NATIVE_TEST_IMAGE")"
          docker push "$NGINX_NATIVE_TEST_IMAGE"
          docker pull "$NGINX_NATIVE_TEST_IMAGE"
          [[ "$(docker image inspect --format '{{.Id}}' "$NGINX_NATIVE_TEST_IMAGE")" == "$built_id" ]]
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$NGINX_NATIVE_TEST_IMAGE")"
          {
            printf 'Shared native nginx modules, release **%s** (nginx 1.29.6, Linux amd64).\n\n' "$RELEASE_VERSION"
            printf 'Image: `%s`\n\nPinned image: `%s`\n\n' "$NGINX_NATIVE_TEST_IMAGE" "$digest"
            printf 'Source: `%s`. Native edge, Kubernetes TLS/readiness, geometry and traffic-tool tests passed.\n' "$GITHUB_SHA"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "MyScoutee nginx $RELEASE_VERSION" --notes-file release-notes.md \
            output/pdf/MyScoutee_Nginx_Guide.pdf
